# Image with everything needed to run Cyber Sandbox Creator.
image: registry.gitlab.ics.muni.cz:443/muni-kypo-csc/cyber-sandbox-creator/csc-debian

# Make sure that VirtualBox kernel modules are loaded and install Python dependencies.
before_script:
  - apt-get update
  - apt-get install -y linux-headers-$(uname -r)
  - lsmod | grep "vbox" || /usr/lib/virtualbox/vboxdrv.sh setup
  - pip3 install -r requirements.txt
  - chmod +x tests/integration_tests/run_tests.sh

# Separating integration tests into several stages to ensure only one job creating virtual environment will run at one time.
# Running several jobs at once will make them fail while testing virtual network. 
# Integration tests need to be separated into several jobs to fit under timeout threshold.
stages:
  - debian
  - kali
  - windows-server

debian:
  stage: debian
  script:
    - tests/integration_tests/run_tests.sh -c testing/ci/config_debian.yml -p
  # run even when other stages fail
  when: always
  # only run for merge requests
  only: 
    - merge_requests

kali-2020:
  stage: kali
  # overwriting global before_script to create a virtual display before running test requiring a display
  before_script:
    - apt-get update
    - apt-get install -y linux-headers-$(uname -r)
    - lsmod | grep "vbox" || /usr/lib/virtualbox/vboxdrv.sh setup
    - pip3 install -r requirements.txt
    - chmod +x tests/integration_tests/run_tests.sh
    - Xvfb :1 -screen 0 800x600x16 &

  script:
    - DISPLAY=:1 tests/integration_tests/run_tests.sh -c testing/ci/config_kali.yml -p
  # run even when other stages fail
  when: always
  # only run for and merge requests
  only: 
    - merge_requests

windows-server:
  stage: windows-server
  script:
    - tests/integration_tests/run_tests.sh -c testing/ci/config_windows_server.yml -p
  # run even when other stages fail
  when: always
  # only run for merge requests
  only: 
    - merge_requests
