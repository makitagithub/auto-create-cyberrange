name: small-sandbox
hosts:
  - name: server
    base_box:
      image: munikypo/debian-10
    flavor: csirtmu.tiny1x4
    cpus: 2

  - name: home
    base_box:
      image: munikypo/debian-10

routers:
  - name: router
    cidr: 100.100.100.0/29

networks:
  - name: server-switch
    cidr: 192.168.20.0/24

  - name: home-switch
    cidr: 192.168.30.0/24

net_mappings:
    - host: server
      network: server-switch
      ip: 192.168.20.5
    - host: home
      network: home-switch
      ip: 192.168.30.5

router_mappings:
    - router: router
      network: server-switch
      ip: 192.168.20.1
    - router: router
      network: home-switch
      ip: 192.168.30.1

