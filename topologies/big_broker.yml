name: bigbroker

hosts:
  - name: web
    base_box:
      image: munikypo/debian-10
    flavor: csirtmu.tiny1x4
    extra:
      memory: 1024

  - name: workstation
    base_box:
      image: munikypo/debian-10
    flavor: csirtmu.tiny1x4
    extra:
      memory: 1024

  - name: database
    base_box:
      image: munikypo/debian-10
    flavor: csirtmu.tiny1x4
    extra:
      memory: 1024

  - name: attacker
    base_box:
      image: munikypo/kali-2019.4
    flavor: csirtmu.tiny1x4
    extra:
      memory: 2048

  - name: client
    base_box:
      image: munikypo/debian-10
    flavor: csirtmu.tiny1x4
    extra:
      memory: 1024

routers:
  - name: big-broker-router
    base_box:
      image: munikypo/debian-10
    flavor: csirtmu.tiny1x4

  - name: internet-router
    base_box:
      image: munikypo/debian-10
    flavor: csirtmu.tiny1x4

networks:
  - name: big-broker
    cidr: 172.18.1.0/24

  - name: internet
    cidr: 10.1.0.0/24

net_mappings:
  - host: web
    network: big-broker
    ip: 172.18.1.5

  - host: workstation
    network: big-broker
    ip: 172.18.1.132

  - host: database
    network: big-broker
    ip: 172.18.1.14

  - host: attacker
    network: internet
    ip: 10.1.0.83

  - host: client
    network: internet
    ip: 10.1.0.4

router_mappings:
  - router: big-broker-router
    network: big-broker
    ip: 172.18.1.1

  - router: internet-router
    network: internet
    ip: 10.1.0.1

groups: []