# 1 network with a host and a router
name: topology3

hosts:
  - name: home
    base_box:
      image: munikypo/debian-10
    flavor: csirtmu.tiny1x4
    extra:
      memory: 512

routers:
  - name: router
    cidr: 100.100.100.0/29
    base_box:
      image: munikypo/debian-10
    flavor: csirtmu.tiny1x4

networks:
  - name: network
    cidr: 10.10.30.0/24

net_mappings:
  - host: home
    network: network
    ip: 10.10.30.5

router_mappings:
  - router: router
    network: network
    ip: 10.10.30.1

groups: []