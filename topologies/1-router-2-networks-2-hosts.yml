# Topology with one router connecting 2 separate networks, each with 1 host
name: 2-networks
hosts:
  - name: server
    base_box:
      image: generic/debian10
    memory: 512

  - name: home
    base_box:
      image: generic/debian10
    memory: 512

routers:
  - name: router

networks:
  - name: server-switch
    cidr: 10.10.20.0/24

  - name: home-switch
    cidr: 10.10.30.0/24

net_mappings:
    - host: server
      network: server-switch
      ip: 10.10.20.5
    - host: home
      network: home-switch
      ip: 10.10.30.5

router_mappings:
    - router: router
      network: server-switch
      ip: 10.10.20.1
    - router: router
      network: home-switch
      ip: 10.10.30.1

